
<html>
<head>
<style>
    .explain-table { width:100%; border-collapse:collapse; white-space:nowrap; text-align:left; font-size:13px; }
    .explain-table span[title] { position: relative; cursor: help; text-decoration: underline dotted #64748b; text-underline-offset: 4px; }
    .explain-table span[title]:hover::after {
        content: attr(title);
        position: absolute;
        bottom: 100%; left: 50%; transform: translateX(-50%);
        background: #1e293b; color: #e2e8f0; padding: 8px 12px;
        border-radius: 6px; border: 1px solid #334155;
        white-space: pre-wrap; font-size: 12px; z-index: 100;
        min-width: 200px;
    }
</style>
</head>
<body>
<div style='overflow:auto; max-height:100px; padding-top: 50px;'>
<table class='explain-table'><tr><td>
<span title='hello world'>Hover me</span>
</td></tr></table>
</div>
</body>
</html>
