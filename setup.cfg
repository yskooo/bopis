[flake8]
# 88 columns (Black's default) rather than pycodestyle's 79. The extra width is
# used almost entirely by the explanatory docstrings, which carry the mapping
# from Chapter 3's equations to the code and are worth the room.
max-line-length = 88
extend-ignore =
    # E203: whitespace before ':' -- conflicts with Black's slice formatting.
    E203,
    # E731: lambda assignment -- used deliberately for short encoder closures.
    E731
exclude =
    .git,
    __pycache__,
    runs,
    data,
    .venv

[pycodestyle]
max-line-length = 88

[tool:pytest]
# pytest is not installed and is not required; tests use stdlib unittest.
# Run them with:  python -m unittest discover -s tests -v
testpaths = tests
